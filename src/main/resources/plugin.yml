name: BundledEssential
version: '${version}'
main: com.bundleessential.BundledEssential
api-version: '1.13'
description: Low resource bundled essentials plugin
author: BundleEssential
softdepend: []

commands:
  tpa:
    description: Send a teleportation request to a player
    usage: /tpa <player>
  tpaccept:
    description: Accept a pending teleportation request
    usage: /tpaccept
  tpahere:
    description: Send a request for a player to teleport to you
    usage: /tpahere <player>
  sethome:
    description: Set your home location
    usage: /sethome
  removehome:
    description: Remove your home
    usage: /removehome
  home:
    description: Teleport to your home
    usage: /home
  back:
    description: Return to your last death location
    usage: /back
  waypoint:
    description: Manage waypoints
    usage: /waypoint [new|delete|name]
  trade:
    description: Send a trade request to a player
    usage: /trade <player>
  tradeaccept:
    description: Accept a pending trade request
    usage: /tradeaccept
  tradecancel:
    description: Cancel your pending trade requests
    usage: /tradecancel
  shop:
    description: Open the shop
    usage: /shop
  pay:
    description: Pay a player
    usage: /pay <player> <amount>
  bounty:
    description: Set or check a bounty on a player
    usage: /bounty <player> [amount]
  bundledhelp:
    description: Show all available commands
    usage: /bundledhelp
  balance:
    description: Check your balance or another player's balance
    usage: /balance [player]
  sell:
    description: Sell the item in your main hand
    usage: /sell
  sellgui:
    description: Open the sell GUI
    usage: /sellgui
  bundledupdate:
    description: Check for and download updates
    usage: /bundledupdate
  paytax:
    description: Pay your accumulated taxes
    usage: /paytax
  cosmetics:
    description: Open the cosmetics shop
    usage: /cosmetics [prefix|joinmessage|deathmessage|killeffect]
  repair:
    description: Repair your held item
    usage: /repair [full]
  level:
    description: Check your server level and XP progress
    usage: /level [player]
  playtime:
    description: Check playtime or view the leaderboard
    usage: /playtime [leaderboard|<player>]
