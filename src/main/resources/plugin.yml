name: Knapsack
version: '${version}'
main: dev.hugocirca.knapsack.KnapsackPlugin
api-version: '1.13'
description: Low resource knapsack essentials plugin
author: HugoCirca
softdepend: []

commands:
  tpa:
    description: Send a teleportation request or open requests GUI
    usage: /tpa <player|here <player>>
  tpahere:
    description: Send a request for a player to teleport to you
    usage: /tpahere <player>
  sethome:
    description: Set your home location (alias to /home set)
    usage: /sethome
    aliases: [sh]
  home:
    description: Teleport home or manage it — GUI or /home set
    usage: /home [set]
  back:
    description: Return to your last death location
    usage: /back
  waypoint:
    description: Manage waypoints — GUI or /waypoint new <name>
    usage: /waypoint [new <name>]
  trade:
    description: Send a trade request (accept/deny in GUI)
    usage: /trade <player>
  shop:
    description: Open the shop or search it by name
    usage: /shop [search <name>]
  pay:
    description: Pay a player
    usage: /pay <player> <amount>
  bounty:
    description: Set or check a bounty on a player
    usage: /bounty <player> [amount]
  bundledhelp:
    description: Show all available commands
    usage: /bundledhelp
  be:
    description: Consolidated hub for help/version/update
    usage: /be <help|version|update>
    aliases: [bundle]
  balance:
    description: Check your balance or another player's balance
    usage: /balance [player]
  resetbal:
    description: Admin reset player balance (no amount = 0)
    usage: /resetbal <player> [amount]
  serverbank:
    description: Show the Server Bank (tax + capped overflow)
    usage: /serverbank [history]
  sell:
    description: Sell the item in your main hand
    usage: /sell
  sellgui:
    description: Open the sell GUI
    usage: /sellgui
  bundledupdate:
    description: Check for and download updates
    usage: /bundledupdate
  bundleversion:
    description: Show the installed BundledEssential version
    usage: /bundleversion
  paytax:
    description: Pay your accumulated taxes
    usage: /paytax
  repair:
    description: Repair your held item
    usage: /repair [full]
  level:
    description: Check your server level and XP progress
    usage: /level [player]
  daily:
    description: Claim your daily login streak reward
    usage: /daily
    aliases: [login, claim, streak, dailylogin]
  quest:
    description: Check, claim, or skip repeatable quests
    usage: /quest [claim|skip]
    aliases: [quests]
  autosell:
    description: Auto-sell chest help and admin give
    usage: /autosell [give <player> [amount]]
  giveaway:
    description: Console giveaway — give money to random winners
    usage: /giveaway <amount> [count|all|<player>]
  playtime:
    description: Check playtime, leaderboard, or opt vault
    usage: /playtime [leaderboard|top|optin|optout|vault|<player>]
  loan:
    description: Borrow money via GUI and repay
    usage: /loan [pay [id|all]|info]
  resetserverbal:
    description: Admin wipe Server Bank to 0
    usage: /resetserverbal
    aliases: [resetbank, resetserverbank]
  money:
    description: Money hub — Balance/Pay/Shop/Sell/Bank/Loan/Tax/Quest/Daily/Repair
    usage: /money
    aliases: [eco, wallet, cash]
  craft:
    description: Open a crafting table
    usage: /craft
    aliases: [workbench, wb]
  bundledreload:
    description: Reload config.yml and features.yml (console friendly)
    usage: /bundledreload
    aliases: [bereload, bereloadconfig, knapsackreload]
