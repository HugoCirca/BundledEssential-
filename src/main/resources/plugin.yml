name: BundledEssential
version: '${version}'
main: com.bundleessential.BundledEssential
api-version: '1.13'
description: Low resource bundled essentials plugin
author: BundleEssential
softdepend: []

commands:
  tpa:
    description: Send a teleportation request to a player
    usage: /tpa <player>
  tpaccept:
    description: Accept a pending teleportation request
    usage: /tpaccept
  tpahere:
    description: Send a request for a player to teleport to you
    usage: /tpahere <player>
  sethome:
    description: Set your home location
    usage: /sethome
  removehome:
    description: Remove your home
    usage: /removehome
  home:
    description: Teleport to your home
    usage: /home
  back:
    description: Return to your last death location
    usage: /back
  waypoint:
    description: Manage waypoints
    usage: /waypoint [new|delete|name]
  trade:
    description: Send a trade request to a player
    usage: /trade <player>
  tradeaccept:
    description: Accept a pending trade request
    usage: /tradeaccept
  tradecancel:
    description: Cancel your pending trade requests
    usage: /tradecancel
