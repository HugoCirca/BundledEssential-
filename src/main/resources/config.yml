# BundledEssential Configuration
# Feature on/off toggles live in features.yml - edit that file to disable features.

# Economy System
economy:
  mob-kill-rewards: true
  playtime-rewards: true
  playtime-min-reward: 2.0
  playtime-max-reward: 5.0

# Leveling System (collect XP orbs to level up, higher level = bigger playtime prize)
leveling:
  base-xp: 100.0
  multiplier: 1.5
  playtime-bonus-per-level: 0.10

# Daily quests + login streak (replaces jobs)
# /daily day N pays: base + (N-1)*per-day + random 0..random-max
# + weekly-bonus every 7th day, + monthly-bonus every 30th day.
# Example defaults: day1 ~$20-30, day30 ~$175, day365 ~$1850.
rewards:
  login:
    base: 20.0
    per-day: 5.0
    random-max: 10.0
    weekly-bonus: 50.0
    monthly-bonus: 200.0
  daily:
    # Multiplies the built-in per-quest rewards (ore/hunt pay more than stone/logs).
    reward-multiplier: 1.0

# Dynamic Light (held torches, lanterns, lava buckets, etc. glow around you)
dynamic-light:
  interval-ticks: 10

# Auto-sell chest (Custom category) — sells chest contents on a timer, split equally.
# Configure: right-click air holding it (interval + recipients).
# Reconfigure placed one: sneak + right-click it. Hoppers feed it normally.
autosell:
  price: 500.0
  default-interval-seconds: 60
  intervals: [30, 60, 300, 600]
  max-recipients: 5

# Stackable zombie spawner (Custom category) — right-click a placed one with
# another spawner item to raise its rate, up to max-multiplier.
spawner:
  price: 500.0
  max-multiplier: 35
