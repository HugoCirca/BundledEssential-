name: Build & Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from build.gradle
        id: version
        run: echo "VERSION=$(grep "version = " build.gradle | head -1 | sed "s/.*'\(.*\)'.*/\1/")" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.VERSION }}" >/dev/null 2>&1; then
            echo "EXISTS=true" >> $GITHUB_OUTPUT
          else
            echo "EXISTS=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.EXISTS == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.VERSION }}" -m "Release v${{ steps.version.outputs.VERSION }}"
          git push origin "v${{ steps.version.outputs.VERSION }}"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BundledEssential-${{ steps.version.outputs.VERSION }}
          path: build/libs/BundledEssential-*.jar

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: BundledEssential v${{ steps.version.outputs.VERSION }}
          body: |
            ## BundledEssential v${{ steps.version.outputs.VERSION }}

            ### Commands
            - `/tpa <player>` - Send teleport request
            - `/tpaccept` - Accept teleport request
            - `/tpahere <player>` - Request player to teleport to you
            - `/sethome` - Set your home
            - `/removehome` - Remove your home
            - `/home` - Teleport to home
            - `/back` - Return to death location
            - `/waypoint` - Open waypoint GUI
            - `/waypoint new <name>` - Create waypoint
            - `/waypoint delete <name>` - Delete waypoint
            - `/trade <player>` - Send trade request
            - `/tradeaccept` - Accept trade request
            - `/tradecancel` - Cancel trade requests
          files: build/libs/BundledEssential-*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
