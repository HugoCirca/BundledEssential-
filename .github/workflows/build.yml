name: Build & Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get current version and increment
        id: version
        run: |
          CURRENT=$(grep "version = " build.gradle | head -1 | sed "s/.*'\(.*\)'.*/\1/")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          PATCH=$((PATCH + 1))
          NEW="${MAJOR}.${MINOR}.${PATCH}"
          echo "OLD=${CURRENT}" >> $GITHUB_OUTPUT
          echo "VERSION=${NEW}" >> $GITHUB_OUTPUT
          sed -i "s/version = '.*'/version = '${NEW}'/" build.gradle
          sed -i "s/archiveVersion.set('.*')/archiveVersion.set('${NEW}')/" build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build.gradle
          git diff --cached --quiet || git commit -m "ci: bump version to ${{ steps.version.outputs.VERSION }}"
          git push

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BundledEssential-${{ steps.version.outputs.VERSION }}
          path: build/libs/BundledEssential-*.jar

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: BundledEssential v${{ steps.version.outputs.VERSION }}
          body: |
            ## BundledEssential v${{ steps.version.outputs.VERSION }}

            ### Commands
            - `/tpa <player>` - Send teleport request
            - `/tpaccept` - Accept teleport request
            - `/tpahere <player>` - Request player to teleport to you
            - `/sethome` - Set your home
            - `/removehome` - Remove your home
            - `/home` - Teleport to home
            - `/back` - Return to death location
            - `/waypoint` - Open waypoint GUI
            - `/waypoint new <name>` - Create waypoint
            - `/waypoint delete <name>` - Delete waypoint
            - `/trade <player>` - Send trade request
            - `/tradeaccept` - Accept trade request
            - `/tradecancel` - Cancel trade requests
          files: build/libs/BundledEssential-*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
