name: Build & Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get current version and increment
        id: version
        run: |
          CURRENT=$(grep "version = " build.gradle | head -1 | sed "s/.*'\(.*\)'.*/\1/")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          PATCH=$((PATCH + 1))
          NEW="${MAJOR}.${MINOR}.${PATCH}"
          echo "OLD=${CURRENT}" >> $GITHUB_OUTPUT
          echo "VERSION=${NEW}" >> $GITHUB_OUTPUT
          sed -i "s/version = '.*'/version = '${NEW}'/" build.gradle
          sed -i "s/archiveVersion.set('.*')/archiveVersion.set('${NEW}')/" build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build.gradle
          git diff --cached --quiet || git commit -m "ci: bump version to ${{ steps.version.outputs.VERSION }}"
          git push

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Knapsack-${{ steps.version.outputs.VERSION }}
          path: build/libs/Knapsack-*.jar

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Knapsack v${{ steps.version.outputs.VERSION }}
          body: |
            ## Knapsack v${{ steps.version.outputs.VERSION }}

            ### Commands (consolidated 2.0)
            - `/tpa <player>` · `/tpa here <player>` · `/tpa` GUI (accept/deny + auto toggle)
            - `/home` GUI (tp/shift-remove/empty-set) · `/home set` · `/sethome` alias
            - `/back` (unchanged)
            - `/waypoint` GUI (tp/shift-delete/empty-new) · `/waypoint new <name>`
            - `/trade <player>` (GUI accept/deny)
            - `/money` hub (`/eco` alias) → Balance/Pay/Shop/Sell/Bounty/Bank/Loan/Tax/Quest/Daily/Repair — shortcuts kept: `/shop` `/sell` `/balance` `/pay` `/resetbal`
            - `/level` · `/playtime` · `/bundledhelp` · `/knapsackreload` · `/craft`
          files: build/libs/Knapsack-*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-id: knapsack
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          name: Knapsack v${{ steps.version.outputs.VERSION }}
          version: ${{ steps.version.outputs.VERSION }}
          version-type: release
          loaders: |
            paper
            purpur
            spigot
            bukkit
            folia
          game-versions: |
            1.21.11
            26.1
            26.1.1
            26.1.2
            26.2
          files: build/libs/Knapsack-*.jar
