plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'com.bundleessential'
version = '1.0.50'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://mvn.wesjd.net/' }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.20.4-R0.1-SNAPSHOT'
    implementation 'net.wesjd:anvilgui:1.10.13-SNAPSHOT'
}

jar {
    // Disabled: the shaded jar below is the real artifact (AnvilGUI must be inside).
    enabled = false
}

shadowJar {
    archiveBaseName.set('BundledEssential')
    archiveVersion.set('1.0.50')
    archiveClassifier.set('')
    relocate 'net.wesjd.anvilgui', 'com.bundleessential.anvilgui'
}

// Captured here (configuration time) so processResources never touches
// the Gradle script object at execution time (configuration-cache safe).
def pluginVersion = project.version.toString()

processResources {
    filesMatching('plugin.yml') {
        expand version: pluginVersion
    }
}
